spring.application.name=backend-catalogo
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
catalog.catedra.base-url=${CATEDRA_REST_URL}
catalog.catedra.jwt=${CATEDRA_TECHNICAL_JWT}
catalog.catedra.kafka-catalog-topic=${KAFKA_CATALOG_TOPIC}
catalog.bootstrap.enabled=true
catalog.reconciliation.enabled=${CATALOG_RECONCILIATION_ENABLED:true}
catalog.reconciliation.interval=${CATALOG_RECONCILIATION_INTERVAL:60s}
catalog.reconciliation.max-attempts=${CATALOG_RECONCILIATION_MAX_ATTEMPTS:3}
catalog.reconciliation.retry-delay=${CATALOG_RECONCILIATION_RETRY_DELAY:1s}

# Redis y Kafka son servicios externos de cátedra. No se crea un broker local.
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.connect-timeout=5s
spring.data.redis.timeout=5s
# La ACL de cátedra permite GET del catálogo, no PING/INFO del health estándar.
management.health.redis.enabled=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties[allow.auto.create.topics]=false
spring.kafka.listener.ack-mode=manual_immediate
catalog.kafka.enabled=true
