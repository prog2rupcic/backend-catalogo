spring.application.name=backend-catalogo
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
catalog.catedra.base-url=${CATEDRA_REST_URL}
catalog.catedra.jwt=${CATEDRA_TECHNICAL_JWT}
catalog.catedra.kafka-catalog-topic=${KAFKA_CATALOG_TOPIC}
catalog.bootstrap.enabled=true

# Redis y Kafka son servicios externos de cátedra. No se crea un broker local.
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.connect-timeout=5s
spring.data.redis.timeout=5s

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID}
