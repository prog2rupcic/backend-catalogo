spring.application.name=backend-catalogo
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# Redis se integra en CAT-02. Su health automático apuntaría a localhost y
# marcaría DOWN aunque el snapshot y PostgreSQL estén correctos.
management.health.redis.enabled=false

catalog.catedra.base-url=${CATEDRA_REST_URL}
catalog.catedra.jwt=${CATEDRA_TECHNICAL_JWT}
catalog.bootstrap.enabled=true
