name: Backend CI

on:
  # Permite validar la rama antes de abrir el PR y solicitar revisión.
  push:
    branches: ['**']
  pull_request:
    branches: [develop, test, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java 25 - Maven verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Preparar Java 25 y caché Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Comprobar Docker para Testcontainers
        run: docker info

      - name: Compilar, probar y generar cobertura
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Publicar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14
